<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Meu Álbum — Copa do Mundo 2026</title>
<meta name="description" content="Organize suas figurinhas do álbum da Copa do Mundo 2026: marque o que você já tem, controle as repetidas e organize suas trocas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" onclick="goHome()">
        <span class="brand-ball">⚽</span>
        <div class="brand-txt">
          <div class="brand-t">Meu Álbum</div>
          <div class="brand-s">Copa do Mundo 2026</div>
        </div>
      </div>
      <div class="topbar-search">
        <input id="searchInput" type="search" placeholder="Buscar jogador ou seleção…" autocomplete="off">
      </div>
      <nav class="topbar-nav">
        <button class="navbtn" data-view="home" onclick="setView('home')">Álbum</button>
        <button class="navbtn" data-view="trade" onclick="setView('trade')">Repetidas</button>
      </nav>
    </div>
    <div class="progressbar-wrap">
      <div class="progressbar"><div id="globalProgressFill" class="progressbar-fill"></div></div>
      <div id="globalProgressLabel" class="progressbar-label"></div>
    </div>
  </header>

  <main id="main"></main>

  <div id="searchResults" class="search-overlay hidden"></div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
